<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邦琪药业 - 后台管理系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='admin/admin.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='vendor/dropzone/dropzone.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='vendor/quill/quill.snow.css') }}" rel="stylesheet">
</head>
<body>

<!-- 启动加载态（认证检查期间显示，避免闪现登录页） -->
<div id="bootSplash" class="boot-splash">
  <span class="logo-block">邦</span>
  <span class="boot-text">正在加载...</span>
</div>

<!-- 登录页（初始隐藏，认证检查确认未登录后才显示） -->
<div id="loginPage" class="login-page" style="display:none;">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-block">邦</span>
      <div>
        <span class="login-title">邦琪药业</span>
        <span class="login-sub">后台管理系统</span>
      </div>
    </div>
    <div class="login-form">
      <input type="text" id="loginUser" class="form-control" placeholder="用户名" autocomplete="username">
      <input type="password" id="loginPass" class="form-control" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn" class="btn btn-primary w-100">登 录</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>
</div>

<!-- 管理后台 -->
<div id="adminApp" class="admin-app" style="display:none;">
  <!-- 侧边栏 -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <span class="logo-block">邦</span>
      <span class="sidebar-title">邦琪后台</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button id="logoutBtn" class="btn-logout">退出登录</button>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="admin-main">
    <header class="admin-topbar">
      <h5 id="pageTitle" class="topbar-title">仪表盘</h5>
      <span class="topbar-user">欢迎，<strong id="topbarUser">admin</strong></span>
    </header>
    <div class="admin-content" id="adminContent"></div>
  </main>
</div>

<!-- 通用 Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">编辑</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="modalSave">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 删除确认 Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="delete-icon">!</div>
        <p class="mt-3 mb-0">确定删除该条记录吗？此操作不可撤销。</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">确认删除</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;">
  <div id="toast" class="toast align-items-center text-white" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg">操作成功</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='vendor/dropzone/dropzone.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/quill/quill.min.js') }}"></script>
<script src="{{ url_for('static', filename='admin/admin.js') }}"></script>
</body>
</html>
